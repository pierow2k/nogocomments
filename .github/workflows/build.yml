name: 'Go Build and Test'
description: 'Runs go build and go test using a matrix for the OS.'
permissions:
  contents: read

on:
  pull_request:
  push:

jobs:
  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [macOS-15, macOS-26, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - run: go build -v ./...
      - run: go test -race ./...
