name: Request Update on pkg.go.dev
description: 'Request an update on pkg.go.dev when new tags are pushed.'

permissions:
  contents: read

on:
  push:
    tags:
      - '*'

jobs:
  update-pkg-go-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Request pkg.go.dev update
        run: |
          MODULE="$(awk '$1 == "module" { print $2; exit }' go.mod)"

          echo "Requesting ${MODULE}@${GITHUB_REF_NAME}"

          curl --fail --silent --show-error \
            "https://proxy.golang.org/${MODULE}/@v/${GITHUB_REF_NAME}.info"
